
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max Lab | Totem de Senhas</title>

<style>
:root {
  --laranja: #F58220;
  --vermelho: #dc3545;
  --azul: #1677d2;
  --fundo: #f4f6f9;
  --texto: #263548;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: var(--fundo);
  color: var(--texto);
}

.container {
  width: 100%;
  max-width: 650px;
  padding: 40px;
  background: white;
  border-radius: 25px;
  box-shadow: 0 12px 40px #172b4d12;
  text-align: center;
}

.logo {
  color: var(--laranja);
  font-size: 38px;
  font-weight: 900;
  margin-bottom: 8px;
}

h1 {
  font-size: 30px;
  margin: 18px 0 10px;
}

.subtitulo {
  color: #64748b;
  font-size: 18px;
  line-height: 1.5;
  margin-bottom: 30px;
}

input {
  width: 100%;
  padding: 22px;
  font-size: 24px;
  border: 2px solid #dbe3ef;
  border-radius: 14px;
  outline: none;
  margin-bottom: 22px;
}

input:focus {
  border-color: var(--laranja);
}

.botoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

button {
  min-height: 125px;
  padding: 20px 12px;
  border: none;
  border-radius: 18px;
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .15s, opacity .15s;
}

button:active:not(:disabled) {
  transform: scale(.97);
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.normal {
  background: var(--azul);
}

.preferencial {
  background: var(--vermelho);
}

.mensagem {
  display: none;
  margin-top: 25px;
  padding: 24px 18px;
  background: #fff4e8;
  color: #7c3e0b;
  border: 2px solid #ffd2a6;
  border-radius: 16px;
  font-size: 21px;
  font-weight: bold;
  line-height: 1.5;
}

.codigo-senha {
  display: block;
  margin: 12px 0;
  color: var(--laranja);
  font-size: clamp(42px, 10vw, 64px);
  font-weight: 900;
  letter-spacing: 2px;
}

@media (max-width: 520px) {
  .container {
    padding: 25px 18px;
  }

  .botoes {
    grid-template-columns: 1fr;
  }

  button {
    min-height: 95px;
  }
}
</style>
</head>

<body>
<main class="container">
  <div class="logo">MAX LAB</div>

  <h1>Bem-vindo(a)!</h1>

  <p class="subtitulo">
    Digite seu nome e selecione o tipo de atendimento.
  </p>

  <input
    type="text"
    id="nome"
    placeholder="Digite seu nome"
    autocomplete="off"
    maxlength="100"
    aria-label="Digite seu nome"
  >

  <div class="botoes">
    <button class="normal" id="btnNormal" disabled>
      NORMAL
    </button>

    <button class="preferencial" id="btnPreferencial" disabled>
      PREFERENCIAL
    </button>
  </div>

  <div class="mensagem" id="mensagem" role="status" aria-live="polite">
    Cadastro realizado com sucesso!
    <span class="codigo-senha" id="codigoSenha"></span>
    Aguarde na recepção.
  </div>
</main>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "maxlab_senhas_v1";

  const nomeInput = document.getElementById("nome");
  const btnNormal = document.getElementById("btnNormal");
  const btnPreferencial = document.getElementById("btnPreferencial");
  const mensagem = document.getElementById("mensagem");
  const codigoSenha = document.getElementById("codigoSenha");

  let canal = null;
  let timeoutMensagem = null;

  try {
    canal = new BroadcastChannel("maxlab_senhas");
  } catch (erro) {
    console.warn("BroadcastChannel indisponível.", erro);
  }

  function estadoInicial() {
    return {
      filas: { G: [], P: [] },
      contadores: { G: 0, P: 0 },
      chamadas: [],
      atual: null,
      sequencia: 0
    };
  }

  function lerEstado() {
    try {
      const salvo = localStorage.getItem(STORAGE_KEY);

      if (!salvo) return estadoInicial();

      const dados = JSON.parse(salvo);

      if (!dados.filas || !dados.contadores) {
        return estadoInicial();
      }

      dados.filas.G ||= [];
      dados.filas.P ||= [];
      dados.contadores.G ||= 0;
      dados.contadores.P ||= 0;
      dados.chamadas ||= [];
      dados.sequencia ||= 0;

      return dados;
    } catch (erro) {
      console.error("Erro ao ler os dados.", erro);
      return estadoInicial();
    }
  }

  function salvarEstado(estado) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));

    if (canal) {
      canal.postMessage({
        tipo: "atualizacao",
        estado
      });
    }
  }

  function atualizarBotoes() {
    const habilitado = nomeInput.value.trim().length > 0;

    btnNormal.disabled = !habilitado;
    btnPreferencial.disabled = !habilitado;
  }

  function mostrarConfirmacao(senha) {
    codigoSenha.textContent = senha;
    mensagem.style.display = "block";

    clearTimeout(timeoutMensagem);

    timeoutMensagem = setTimeout(() => {
      mensagem.style.display = "none";
      codigoSenha.textContent = "";
    }, 10000);
  }

  function gerarSenha(tipo) {
    const nome = nomeInput.value.trim();

    if (!nome) {
      nomeInput.focus();
      return;
    }

    const estado = lerEstado();

    estado.contadores[tipo]++;

    const numero = String(estado.contadores[tipo]).padStart(3, "0");
    const senha = `${tipo}-${numero}`;

    estado.filas[tipo].push({
      nome,
      senha,
      tipo,
      criadoEm: new Date().toISOString()
    });

    try {
      salvarEstado(estado);

      nomeInput.value = "";
      atualizarBotoes();

      mostrarConfirmacao(senha);
      nomeInput.focus();
    } catch (erro) {
      console.error("Não foi possível salvar a senha.", erro);
      alert("Não foi possível cadastrar a senha. Tente novamente.");
    }
  }

  nomeInput.addEventListener("input", atualizarBotoes);

  btnNormal.addEventListener("click", () => gerarSenha("G"));
  btnPreferencial.addEventListener("click", () => gerarSenha("P"));

  atualizarBotoes();
})();
</script>
</body>
</html>
