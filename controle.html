
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Lab | Controle</title>
<style>
:root{--orange:#F58220;--blue:#1677d2;--red:#dc3545;--purple:#7B3FA1;--green:#16834a}
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f2f5fa;color:#172b4d}
main{max-width:1500px;margin:auto}
header,.stats,.queues,.guiches{display:flex;gap:14px;flex-wrap:wrap}
header{justify-content:space-between;align-items:center;margin-bottom:22px}
h1{margin:0}.logo{color:var(--orange)}
.stats{justify-content:center;margin-bottom:20px}
.stat,.panel,.queue{background:white;border-radius:15px;padding:18px;box-shadow:0 4px 18px #172b4d0b}
.stat{font-size:17px}
.panel{text-align:center;margin-bottom:22px}
button{border:0;border-radius:9px;padding:13px 17px;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#call{background:var(--orange);color:white;font-size:23px;padding:20px;width:min(100%,500px)}
#recall{margin-top:10px;background:#e8edf5;color:#172b4d}
#pending{display:none;margin-top:18px;border:2px solid #dbe3ef;border-radius:12px;padding:18px}
.guiches{justify-content:center;margin-top:12px}
.guiches button{background:var(--orange);color:white}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}.current{margin:0 0 18px;background:white;border-radius:15px;padding:18px;box-shadow:0 4px 18px #172b4d0b}.current-title{font-size:13px;text-transform:uppercase;color:#64748b;font-weight:bold}.current-ticket{font-size:32px;font-weight:900;margin-top:4px}.current-name{font-weight:bold;text-transform:uppercase;margin-top:3px}.current-wait{margin-top:8px;color:#64748b;font-variant-numeric:tabular-nums}.queues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.queue{padding:0;overflow:hidden;min-width:0}
.qtitle{padding:18px;color:white;font-size:20px;font-weight:bold}
.qG{background:var(--blue)}.qP{background:var(--red)}.qE{background:var(--purple)}
.list{padding:12px;min-height:100px}
.patient{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e3e9f2;border-radius:9px;padding:12px;margin-bottom:9px}
.info{min-width:0;overflow-wrap:anywhere}.pname{font-weight:bold;text-transform:uppercase}.ticket{font-size:18px;font-weight:900;margin-top:5px}.wait{font-size:14px;color:#64748b;margin-top:6px;font-variant-numeric:tabular-nums}.wait strong{color:#172b4d}
.empty{color:#8190a5;text-align:center;padding:20px}
#status{color:#64748b;margin-top:12px;min-height:18px}.history{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 18px #172b4d0b}.history-title{padding:18px;font-size:20px;font-weight:bold;background:#e8edf5}.history-list{padding:12px;max-height:520px;overflow:auto}.history-item{border:1px solid #e3e9f2;border-radius:9px;padding:11px;margin-bottom:9px}.history-ticket{font-weight:900;font-size:18px}.history-name{font-weight:bold;text-transform:uppercase;margin-top:3px;overflow-wrap:anywhere}.history-meta{font-size:12px;color:#64748b;margin-top:6px;line-height:1.45}.history-empty{color:#8190a5;text-align:center;padding:25px 10px}
footer{text-align:center;margin-top:28px}#reset{background:transparent;color:#8994a5;font-size:13px}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.history-list{max-height:280px}}
@media(max-width:760px){.queues{grid-template-columns:1fr}.patient{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
<header><h1><span class="logo">MAX LAB</span> | Atendimento</h1><strong>Controle de Senhas</strong></header>
<section class="stats">
  <div class="stat">Normais: <strong id="totalG">0</strong></div>
  <div class="stat">Preferenciais: <strong id="totalP">0</strong></div>
  <div class="stat">Preferencial +80: <strong id="totalE">0</strong></div>
  <div class="stat">Total: <strong id="total">0</strong></div>
</section>
<div class="layout">
  <div>
    <section class="panel">
      <button id="call">CHAMAR PRÓXIMO</button><br>
      <button id="recall">Rechamar Atual</button>
      <div id="pending">
        <h2 id="pendingText"></h2>
        <p>Direcionar paciente para qual guichê?</p>
        <div class="guiches">
          <button data-guiche="1">Guichê 1</button>
          <button data-guiche="2">Guichê 2</button>
          <button data-guiche="3">Guichê 3</button>
        </div>
      </div>
      <div id="status" role="status"></div>
    </section>
    <section class="queues">
      <div class="queue"><div class="qtitle qE">Preferencial +80 (E)</div><div class="list" id="listE"></div></div>
      <div class="queue"><div class="qtitle qP">Preferencial (P)</div><div class="list" id="listP"></div></div>
      <div class="queue"><div class="qtitle qG">Normal (G)</div><div class="list" id="listG"></div></div>
    </section>
  </div>
  <aside class="history">
    <div class="history-title">Histórico de Atendimentos</div>
    <div class="history-list" id="historyList"></div>
  </aside>
</div>
<footer><button id="reset">Resetar Todas as Filas</button></footer>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(() => {
  const firebaseConfig = {
    apiKey: "AIzaSyBCQVEjkzdG-OshK9HgXwto6Ez9CzjuCjo",
    authDomain: "maxlab-senhas.firebaseapp.com",
    databaseURL: "https://maxlab-senhas-default-rtdb.firebaseio.com",
    projectId: "maxlab-senhas",
    storageBucket: "maxlab-senhas.firebasestorage.app",
    messagingSenderId: "403118178001",
    appId: "1:403118178001:web:c99c52fa089b778e8d4ff0"
  };

  firebase.initializeApp(firebaseConfig);
  const ref = firebase.database().ref("maxlab/state");
  const $ = id => document.getElementById(id);
  let state = null;
  let pending = null;
  const labels = {G:"NORMAL",P:"PREFERENCIAL",E:"PREFERENCIAL +80"};
  const colors = {G:"#1677d2",P:"#dc3545",E:"#7B3FA1"};

  function initial() {
    return {filas:{G:[],P:[],E:[]},contadores:{G:0,P:0,E:0},chamadas:[],historico:[],atual:null,vezPG:"P"};
  }
  function normalize(s) {
    s = s || initial();
    s.filas = s.filas || {};
    s.contadores = s.contadores || {};
    ["G","P","E"].forEach(t => {
      s.filas[t] = Array.isArray(s.filas[t]) ? s.filas[t] : [];
      s.contadores[t] = Number(s.contadores[t]) || 0;
    });
    s.chamadas = Array.isArray(s.chamadas) ? s.chamadas : [];
    s.historico = Array.isArray(s.historico) ? s.historico : [];
    s.atual = s.atual || null;
    s.vezPG = s.vezPG === "G" ? "G" : "P";
    return s;
  }
  function save(s) { return ref.set(s); }

  function formatWait(createdAt) {
    const start = new Date(createdAt || Date.now()).getTime();
    let seconds = Math.max(0, Math.floor((Date.now() - start) / 1000));
    const h = Math.floor(seconds / 3600);
    seconds %= 3600;
    const m = Math.floor(seconds / 60);
    const sec = seconds % 60;
    return h > 0
      ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
      : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  }

  function formatDuration(seconds) {
    seconds = Math.max(0, Number(seconds) || 0);
    const h = Math.floor(seconds / 3600);
    seconds %= 3600;
    const m = Math.floor(seconds / 60);
    const sec = seconds % 60;
    return h > 0
      ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
      : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  }

  function formatDate(iso) {
    if (!iso) return "--";
    return new Date(iso).toLocaleString("pt-BR", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }

  function drawQueue(type) {
    const el = $("list"+type);
    el.replaceChildren();
    const people = state.filas[type];
    if (!people.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nenhum paciente aguardando.";
      el.appendChild(empty);
      return;
    }
    people.forEach(p => {
      const row = document.createElement("div"); row.className = "patient";
      const info = document.createElement("div"); info.className = "info";
      const name = document.createElement("div"); name.className = "pname"; name.textContent = p.nome;
      const ticket = document.createElement("div"); ticket.className = "ticket"; ticket.style.color = colors[type]; ticket.textContent = p.senha;
      const wait = document.createElement("div"); wait.className = "wait";
      wait.innerHTML = `⏱ Tempo de espera: <strong data-wait-created="${p.criadoEm || ""}">${formatWait(p.criadoEm)}</strong>`;
      info.append(name,ticket,wait);
      row.append(info); el.appendChild(row);
    });
  }

  function drawHistory() {
    const el = $("historyList");
    el.replaceChildren();
    if (!state.historico.length) {
      const empty = document.createElement("div"); empty.className = "history-empty"; empty.textContent = "Nenhuma senha chamada ainda."; el.appendChild(empty); return;
    }
    state.historico.forEach(item => {
      const row = document.createElement("div"); row.className = "history-item";
      const ticket = document.createElement("div"); ticket.className = "history-ticket"; ticket.style.color = colors[item.tipo] || "#172b4d"; ticket.textContent = item.senha;
      const name = document.createElement("div"); name.className = "history-name"; name.textContent = item.nome || "Paciente";
      const meta = document.createElement("div"); meta.className = "history-meta";
      meta.innerHTML = `Guichê ${item.guiche || "--"}<br>Chamado: ${formatDate(item.chamadaEm)}<br>Espera: <strong>${formatDuration(item.tempoEsperaSegundos)}</strong>`;
      row.append(ticket,name,meta); el.appendChild(row);
    });
  }


  function render() {
    if (!state) return;
    ["G","P","E"].forEach(t => {
      $("total"+t).textContent = state.filas[t].length;
      drawQueue(t);
    });
    $("total").textContent = ["G","P","E"].reduce((n,t)=>n+state.filas[t].length,0);
    $("call").disabled = !!pending || !["E","P","G"].some(t=>state.filas[t].length);
    $("recall").disabled = !state.atual;
    $("pending").style.display = pending ? "block" : "none";
    $("pendingText").textContent = pending ? `${pending.senha} — ${pending.nome} (${labels[pending.tipo]})` : "";
    drawHistory();
  }

  function getNextType(s) {
    if (s.filas.E.length > 0) return "E";
    const preferred = s.vezPG === "G" ? ["G","P"] : ["P","G"];
    return preferred.find(t => s.filas[t].length) || null;
  }


  $("call").addEventListener("click", () => {
    if (!state || pending) return;
    const type = getNextType(state);
    if (!type) { $("status").textContent = "Não há pacientes aguardando."; return; }
    pending = {...state.filas[type][0],tipo:type};
    $("status").textContent = "Selecione o guichê para realizar a chamada.";
    render();
  });

  document.querySelectorAll("[data-guiche]").forEach(btn => btn.addEventListener("click", async () => {
    if (!pending) return;
    const p = pending, guiche = Number(btn.dataset.guiche);
    pending = null;
    try {
      let committed = false;
      await ref.transaction(raw => {
        const s = normalize(raw);
        const i = s.filas[p.tipo].findIndex(x=>x.senha===p.senha);
        if (i < 0) return;
        const [patient] = s.filas[p.tipo].splice(i,1);
        const chamadaEm = new Date().toISOString();
        const criadoEm = patient.criadoEm || chamadaEm;
        const tempoEsperaSegundos = Math.max(
          0,
          Math.floor((new Date(chamadaEm).getTime() - new Date(criadoEm).getTime()) / 1000)
        );

        const call = {
          ...patient,
          guiche,
          chamadaEm,
          tempoEsperaSegundos
        };

        s.atual = call;
        s.chamadas.unshift(call);
        s.chamadas = s.chamadas.slice(0,3);

        // P e G alternam; E não altera a vez do ciclo P/G.
        if (p.tipo === "P") s.vezPG = "G";
        if (p.tipo === "G") s.vezPG = "P";

        // Ao ser chamado, sai da fila e entra imediatamente no histórico.
        s.historico.unshift(call);
        s.historico = s.historico.slice(0,30);

        committed = true;
        return s;
      });
      $("status").textContent = committed ? `Senha ${p.senha} direcionada ao Guichê ${guiche}.` : "Paciente não encontrado na fila.";
    } catch(e) { $("status").textContent = "Erro ao registrar a chamada."; console.error(e); }
    render();
  }));
 
  $("recall").addEventListener("click", async () => {
    if (!state || !state.atual) return;
    try {
      await ref.transaction(raw => {
        const s = normalize(raw);
        if (!s.atual) return;
        s.atual = {...s.atual,rechamadaEm:new Date().toISOString()};
        return s;
      });
      $("status").textContent = "Rechamada enviada.";
    } catch(e) { $("status").textContent = "Erro ao rechamar."; }
  });

  $("reset").addEventListener("click", async () => {
    if (!confirm("Deseja limpar todas as filas, contadores e histórico?")) return;
    pending = null;
    try { await save(initial()); $("status").textContent = "Filas e histórico resetados."; }
    catch(e) { $("status").textContent = "Erro ao resetar."; }
    render();
  });

  setInterval(() => {
    document.querySelectorAll("[data-wait-created]").forEach(el => {
      el.textContent = formatWait(el.dataset.waitCreated);
    });
  }, 1000);

  ref.on("value", snap => { state = normalize(snap.val()); render(); },
    err => { $("status").textContent = "Erro de conexão com o banco: " + err.message; });
})();
</script>
</body>
</html>
